<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signet · Onboarding preview</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#edece9;background:#101111;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #e8b786;outline-offset:4px}button{color:inherit} .dashboard{height:100vh;display:grid;grid-template-columns:205px 1fr;filter:blur(2px);opacity:.33;pointer-events:none}.sidebar{padding:28px 24px;border-right:1px solid #333}.brand{font-weight:650;letter-spacing:-.5px}.nav{margin-top:48px;display:grid;gap:25px;color:#999;font-size:13px}.home{padding:65px 50px}.home h1{font-weight:500;font-size:27px}.ghosts{display:flex;gap:16px;margin-top:40px}.ghost{height:140px;border:1px solid #444;border-radius:10px;flex:1;padding:20px;font-size:12px;color:#aaa}.preview-bar{position:fixed;top:16px;left:0;width:100%;display:flex;justify-content:center;gap:18px;align-items:center;z-index:4;color:#aaa;font-size:10px;letter-spacing:1.2px;text-transform:uppercase}.preview-bar button{border:0;background:transparent;text-decoration:underline;font-size:10px;color:#bcb9b3;letter-spacing:.5px}.scrim{position:fixed;inset:0;background:#05060670}.modal{position:fixed;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(650px,calc(100vw - 32px));height:min(540px,calc(100dvh - 92px));min-height:350px;border:1px solid #3a3b39;border-radius:16px;background:linear-gradient(145deg,#232422,#1a1b1a 70%);box-shadow:0 35px 110px #000b,0 1px 0 #ffffff10 inset;display:flex;flex-direction:column;overflow:hidden}.top{height:48px;flex-shrink:0;padding:17px 22px;display:flex;align-items:center;justify-content:space-between}.wordmark{display:flex;align-items:center;gap:9px;font-size:12px;color:#babbb5;letter-spacing:.15px}.mark{display:inline-grid;grid-template-columns:repeat(3,3px);gap:2px;transform:rotate(-15deg)}.mark i{background:#e2c5a4;width:3px;height:3px;border-radius:1px}.close{border:0;background:none;color:#969a92;font-size:23px;line-height:1;padding:3px}.body{flex:1;overflow-y:auto;padding:8px 54px 20px;text-align:center}.scene{animation:arrive .25s ease-out}.eyebrow{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#bca68b;margin:11px 0 14px}h1{font-size:30px;font-weight:560;line-height:1.15;letter-spacing:-1.2px;margin:0 0 12px}p{font-size:13px;color:#a7aba2;line-height:1.65;margin:0 auto 22px;max-width:400px}.hero{height:145px;display:flex;align-items:center;justify-content:center;gap:18px;position:relative}.app-icon{width:46px;height:46px;border:1px solid #55534f;background:#30312e;display:grid;place-items:center;border-radius:12px;font-size:23px}.app-icon.claude{color:#d99575}.app-icon.codex{font-size:19px;color:#eee}.memory-node{width:80px;height:80px;border-radius:22px;display:grid;place-items:center;border:1px solid #917554;background:radial-gradient(circle at 35% 25%,#67503a,#292623);box-shadow:0 0 55px #bb8d4930;font-size:30px;color:#e5c19a}.thread{height:1px;width:42px;background:linear-gradient(90deg,#484a45,#c8a67e,#484a45);position:relative}.thread:after{content:'';width:4px;height:4px;background:#e9c396;position:absolute;top:-1px;border-radius:50%;animation:travel 2s infinite}.memory-note{font-size:11px;color:#c4c5bd;padding:10px 15px;background:#ffffff04;border:1px solid #ffffff0b;border-radius:7px;display:inline-block}.footer{height:65px;flex-shrink:0;border-top:1px solid #ffffff09;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.footer-left{display:flex;align-items:center;gap:17px}.back{border:0;background:none;font-size:12px;color:#b0b3aa;padding:7px 0;min-width:33px}.dots{display:flex;gap:6px}.dot{width:4px;height:4px;border-radius:50%;background:#555750}.dot.active{background:#e7c5a1;width:14px;border-radius:3px}.primary{border:1px solid #e9ddd0;background:#e9ddd0;color:#272622;border-radius:7px;padding:9px 16px;font-size:12px;font-weight:600;display:flex;gap:19px;align-items:center}.primary:hover{background:#f6ede2}.choices{display:grid;gap:9px;text-align:left;margin-top:23px}.choice{background:#ffffff03;border:1px solid #44463f;border-radius:9px;padding:13px 15px;display:flex;align-items:center;gap:13px;min-height:58px}.choice:hover{background:#ffffff07}.choice.selected{border-color:#b59c7c;background:#d6b58909}.choice .app-icon{width:31px;height:31px;border-radius:8px;font-size:17px}.choice strong{font-size:13px;font-weight:500}.choice small{display:block;color:#989e91;font-size:11px;margin-top:3px}.tick{margin-left:auto;width:16px;height:16px;border:1px solid #666b5e;border-radius:4px;display:grid;place-items:center;color:#20221c;font-size:11px}.selected .tick{background:#cfc6b6;border-color:#cfc6b6}.muted-link{border:0;background:none;color:#a7ab9e;text-decoration:underline;text-underline-offset:3px;font-size:11px;padding:12px 0}.auth-card,.chat{border:1px solid #45473f;background:#15171355;border-radius:11px;padding:23px;margin-top:25px}.auth-icon{width:48px;height:48px;border:1px solid #565a4d;border-radius:14px;margin:0 auto 14px;display:grid;place-items:center;font-size:22px}.status{font-size:12px;color:#cbd0c1;margin-top:14px;line-height:1.6}.failure{border:1px solid #956a4755;background:#95704713;border-radius:8px;padding:12px;margin-top:14px;color:#e6b991;font-size:12px;line-height:1.6}.fixture{font-size:10px;color:#929889;margin:14px 0 0}.success-icon{color:#c9d2b7}.chat{text-align:left;padding:18px}.chat-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#979f8e;margin-bottom:10px}.memory-input{width:100%;resize:none;border:1px solid #515747;border-radius:7px;padding:11px 12px;font-size:13px;background:#242820;color:#e6e9e0}.bubble{font-size:13px;line-height:1.7;color:#e0e3d8;border-left:2px solid #b0ba96;padding-left:14px;margin-top:15px}.receipt{display:flex;align-items:center;gap:9px;padding:12px 0;font-size:12px;color:#c4cbb8;text-align:left;border-bottom:1px solid #ffffff08}.receipt:last-child{border:0}.receipt span{color:#b5c39a}.ready-art{height:90px;display:grid;place-items:center}.ready-art span{width:57px;height:57px;border:1px solid #727e5c;border-radius:50%;display:grid;place-items:center;color:#d0dabd;font-size:26px;box-shadow:0 0 65px #bed29215}.failure-toggle{position:fixed;bottom:15px;left:0;width:100%;text-align:center;font-size:11px;color:#a1a697;display:flex;justify-content:center;align-items:center;gap:7px}.failure-toggle input{accent-color:#d7b588}.resume{position:fixed;inset:0;display:none;place-content:center;text-align:center;gap:15px}.resume button{margin:auto}.resume p{margin:0}.hidden{display:none!important}@keyframes arrive{from{opacity:0;transform:translateX(9px)}to{opacity:1;transform:none}}@keyframes travel{from{left:0;opacity:0}40%{opacity:1}to{left:100%;opacity:0}}@media(max-height:580px){.body{padding:0 38px 12px}h1{font-size:26px}.hero{height:89px}.eyebrow{margin:2px 0 9px}p{margin-bottom:12px}.choices{margin-top:13px;gap:6px}.choice{padding:9px 13px;min-height:49px}.auth-card,.chat{margin-top:13px;padding:15px}.ready-art{height:66px}}@media(max-width:520px){.body{padding:8px 23px 16px}h1{font-size:26px}.dashboard{grid-template-columns:120px 1fr}.home{padding:50px 20px}.preview-bar{font-size:8px;gap:10px}.hero{gap:11px}.thread{width:23px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="dashboard" aria-hidden="true"><div class="sidebar"><div class="brand">⠿ Signet</div><div class="nav"><span>Home</span><span>Agents</span><span>Memory</span><span>Sources</span><span>Dreams</span></div></div><main class="home"><h1>A little more continuity.</h1><p>Your memory, across every conversation.</p><div class="ghosts"><div class="ghost">RECENT MEMORY</div><div class="ghost">CONNECTED AGENTS</div></div></main></div>
<div class="scrim"></div>
<div class="preview-bar"><span>Interaction preview · simulated connections</span><button id="reset">Restart preview</button></div>
<div class="resume" id="resume"><p>Pick up where you left off.</p><button class="primary" id="reopen">Continue setup <span>→</span></button></div>
<section class="modal" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="description" id="modal">
<header class="top"><div class="wordmark"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>signet</div><button class="close" aria-label="Close onboarding" id="close">×</button></header>
<div class="body" id="body"></div>
<footer class="footer"><div class="footer-left"><button class="back" id="back">Back</button><div class="dots" aria-label="Progress" id="dots"></div></div><button class="primary" id="next"></button></footer>
</section>
<label class="failure-toggle"><input type="checkbox" id="fail"> Preview a failed sign-in</label>
<script>
// A standalone interaction sketch. No daemon, provider, or credential requests.
const key='signet-onboarding-prototype-v1';
const fresh=()=>({step:0,agents:['Claude Code','Codex'],provider:'',connected:false,verified:false,memory:'I prefer short answers with concrete examples.',saved:false,recalled:false,closed:false});
let state=fresh();try{const old=JSON.parse(localStorage.getItem(key));if(old&&Number.isInteger(old.step)&&old.step>=0&&old.step<=4)state={...state,...old};}catch{}
let failed=false;let waiting=false;
const body=document.getElementById('body'),next=document.getElementById('next');
const escape=(text)=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const persist=()=>localStorage.setItem(key,JSON.stringify(state));
const heading=(over,title,desc)=>`<div class="eyebrow">${over}</div><h1 id="title">${title}</h1><p id="description">${desc}</p>`;
function render(){
 persist();document.getElementById('modal').classList.toggle('hidden',state.closed);document.getElementById('resume').style.display=state.closed?'grid':'none';
 document.getElementById('back').style.visibility=state.step?'visible':'hidden';
 document.getElementById('dots').innerHTML=[0,1,2,3,4].map(i=>`<span class="dot ${state.step===i?'active':''}" aria-label="Step ${i+1}${state.step===i?', current':''}"></span>`).join('');
 next.disabled=false;let html='';let label='Continue';
 if(state.step===0){html=`<div class="hero" aria-hidden="true"><div class="app-icon claude">✳︎</div><span class="thread"></span><div class="memory-node">⠿</div><span class="thread"></span><div class="app-icon codex">⌘</div></div>${heading('A familiar starting point','Your agents should remember you.','Keep your preferences, decisions, and context with you — even when the conversation or the agent changes.')}<div class="memory-note">Remember once. Pick up anywhere.</div>`;label='Get started';}
 if(state.step===1){html=heading('01 / Your agents','Where do you work?','Connect the agents you use. They’ll share the context you choose to keep.')+`<div class="choices">${[['Claude Code','✳︎','claude'],['Codex','⌘','codex'],['Hermes','↗','']].map(([name,icon,cls])=>`<button class="choice ${state.agents.includes(name)?'selected':''}" data-agent="${name}" aria-pressed="${state.agents.includes(name)}"><span class="app-icon ${cls}">${icon}</span><span><strong>${name}</strong><small>${name==='Hermes'?'Connect this agent':'Detected · example installation'}</small></span><span class="tick">${state.agents.includes(name)?'✓':''}</span></button>`).join('')}</div><button class="muted-link" id="later">I’ll connect an agent later</button>`;next.disabled=!state.agents.length;}
 if(state.step===2){
  html=heading('02 / Your connection','Give memory a little intelligence.','Choose what helps Signet organize your memories. You can use an existing subscription or a model on your machine.');
  if(!state.provider){html+=`<div class="choices">${[['ChatGPT','Use your ChatGPT subscription','◎'],['Claude','Connect your Claude account','✳︎'],['Local model','Process on your own machine','⌂']].map(([name,desc,icon])=>`<button class="choice" data-provider="${name}"><span class="app-icon">${icon}</span><span><strong>${name}</strong><small>${desc}</small></span><span style="margin-left:auto;color:#959b8c">→</span></button>`).join('')}</div>`;next.disabled=true;}
  else{html+=`<div class="auth-card"><div class="auth-icon ${state.connected?'success-icon':''}">${state.connected?'✓':state.provider==='Local model'?'⌂':'◎'}</div><strong style="font-size:14px">${state.connected?escape(state.provider)+' connected':waiting?'Finish signing in in your browser':escape(state.provider)}</strong><div class="status">${state.verified?'Connection checked. Memory processing is enabled.':state.connected?'Sign-in saved. Test the recommended model and enable memory processing. You can change the model later.':waiting?'Come back here when you’re done. Your place is saved.':state.provider==='Local model'?'We’ll check your local server before continuing.':'Signet will send relevant text to this provider to organize memory. Your original evidence stays in your workspace.'}</div>${failed?'<div class="failure" role="alert">Sign-in didn’t finish. Your workspace is safe.<br>Try again — you won’t have to repeat setup.</div>':''}<p class="fixture">${waiting?'Preview: the button below simulates returning from the browser.':'Preview only. No account is accessed or connected.'}</p></div><button class="muted-link" id="provider-back">Choose another connection</button>`;label=state.verified?'Continue':state.connected?'Test and enable memory':waiting?'Simulate browser return':failed?'Try sign-in again':state.provider==='Local model'?'Check local model':'Sign in with '+state.provider;}
 }
 if(state.step===3){html=heading('03 / A first memory','Try a little continuity.','Tell Signet something useful. Then see how it carries into a fresh conversation.')+`<div class="chat"><div class="chat-label">${state.saved?'A new conversation':'Something worth remembering'}</div>${!state.saved?`<input class="memory-input" aria-label="Your first memory" id="memory" maxlength="240" value="${escape(state.memory)}"><div class="fixture">This example stays in this browser preview.</div>`:`<div style="font-size:13px">What should you know about how I like to work?</div>${state.recalled?`<div class="bubble">${escape(state.memory)}</div><div class="fixture">✓ Recalled from the memory you just saved · simulated</div>`:'<div class="status">Your memory was saved. Let’s ask in a new conversation.</div>'}`}</div>`;label=!state.saved?'Remember this':!state.recalled?'Recall it':'Continue';next.disabled=!state.memory.trim();}
 if(state.step===4){html=`<div class="ready-art"><span>✓</span></div>${heading('You’re ready','Start somewhere familiar.','Open a new conversation in your agent. Signet brings the useful context along.')}<div style="max-width:350px;margin:0 auto"><div class="receipt"><span>✓</span>${state.agents.length?escape(state.agents.join(' & ')):'Connect an agent when you’re ready'}</div><div class="receipt"><span>✓</span>${escape(state.provider)} for memory processing</div><div class="receipt"><span>✓</span>Your first memory, ready to recall</div></div><p class="fixture">End of preview. These connections and results are simulated.</p>`;label='Open Signet';}
 body.innerHTML=`<div class="scene">${html}</div>`;next.innerHTML=`${label}<span aria-hidden="true">→</span>`;
 body.querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>{const name=b.dataset.agent;state.agents=state.agents.includes(name)?state.agents.filter(x=>x!==name):[...state.agents,name];render();});
 body.querySelectorAll('[data-provider]').forEach(b=>b.onclick=()=>{state.provider=b.dataset.provider;render();});
 const providerBack=document.getElementById('provider-back');if(providerBack)providerBack.onclick=()=>{state.provider='';state.connected=false;state.verified=false;waiting=false;failed=false;render();};
 const later=document.getElementById('later');if(later)later.onclick=()=>{state.agents=[];state.step++;render();};
 const input=document.getElementById('memory');if(input)input.oninput=()=>{state.memory=input.value;next.disabled=!state.memory.trim();persist();};
}
next.onclick=()=>{
 if(state.step===2&&!state.connected){if(!state.provider)return;if(!waiting&&state.provider!=='Local model'){waiting=true;failed=false;}else if(document.getElementById('fail').checked){failed=true;waiting=false;}else{state.connected=true;waiting=false;failed=false;}}
 else if(state.step===2&&!state.verified){state.verified=true;}
 else if(state.step===3&&!state.saved){state.saved=true;}
 else if(state.step===3&&!state.recalled){state.recalled=true;}
 else if(state.step===4){state.closed=true;}
 else{state.step++;}render();
};
document.getElementById('back').onclick=()=>{if(state.step>0)state.step--;waiting=false;failed=false;render();};
document.getElementById('close').onclick=()=>{state.closed=true;render();document.getElementById('reopen').focus();};
document.getElementById('reopen').onclick=()=>{state.closed=false;render();next.focus();};
document.getElementById('reset').onclick=()=>{state=fresh();waiting=false;failed=false;document.getElementById('fail').checked=false;render();};
document.addEventListener('keydown',e=>{if(state.closed)return;if(e.key==='Escape'){state.closed=true;render();document.getElementById('reopen').focus();}if(e.key==='Tab'){const items=[...document.getElementById('modal').querySelectorAll('button,input')].filter(el=>!el.disabled&&getComputedStyle(el).visibility!=='hidden');const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();next.focus();
</script>
</body>
</html>
