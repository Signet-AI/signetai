name: Promote Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nightly version to promote to stable/latest (e.g. 0.113.1)"
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Promote GitHub release to stable/latest
        run: |
          set -euo pipefail
          gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          echo "Promoted v${VERSION} to stable/latest on GitHub"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
