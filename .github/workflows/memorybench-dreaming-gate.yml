name: MemoryBench Dreaming Gate
on:
  pull_request:
    paths: ["platform/rust-daemon/**", "platform/rust-core/**", "scripts/native-dreaming-gate.ts", ".github/workflows/memorybench-dreaming-gate.yml"]
  push:
    branches: [main]
    paths: ["platform/rust-daemon/**", "platform/rust-core/**", "scripts/native-dreaming-gate.ts", ".github/workflows/memorybench-dreaming-gate.yml"]
permissions: { contents: read }
jobs:
  dreaming-gate:
    name: Native Rust Dreaming scope and restart contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build fresh Rust binary
        run: cargo build --manifest-path platform/rust-daemon/Cargo.toml
      - name: Run blocking Bun-driven Dreaming contract
        env:
          SIGNET_RUST_DAEMON_BIN: ${{ github.workspace }}/platform/rust-daemon/target/debug/signet-daemon
        run: bun scripts/native-dreaming-gate.ts
