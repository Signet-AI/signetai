name: MemoryBench Dreaming Gate

on:
  pull_request:
    paths:
      - "memorybench/config/dreaming-gate/**"
      - "memorybench/src/benchmarks/dreaming-scenarios/**"
      - "memorybench/src/benchmarks/index.ts"
      - "memorybench/src/cli/index.ts"
      - "memorybench/src/providers/signet/**"
      - "memorybench/src/orchestrator/**"
      - "memorybench/src/types/benchmark.ts"
      - "memorybench/src/types/provider.ts"
      # The fixture imports source transitively from both packages. Keep these
      # broad dependency contracts instead of maintaining drifting allowlists
      # whenever Dreaming or its storage implementation gains a helper.
      - "platform/daemon/src/**"
      - "platform/core/src/**"
      - ".github/workflows/memorybench-dreaming-gate.yml"
  push:
    branches: [main]
    paths:
      - "memorybench/config/dreaming-gate/**"
      - "memorybench/src/benchmarks/dreaming-scenarios/**"
      - "memorybench/src/benchmarks/index.ts"
      - "memorybench/src/cli/index.ts"
      - "memorybench/src/providers/signet/**"
      - "memorybench/src/orchestrator/**"
      - "memorybench/src/types/benchmark.ts"
      - "memorybench/src/types/provider.ts"
      # The fixture imports source transitively from both packages. Keep these
      # broad dependency contracts instead of maintaining drifting allowlists
      # whenever Dreaming or its storage implementation gains a helper.
      - "platform/daemon/src/**"
      - "platform/core/src/**"
      - ".github/workflows/memorybench-dreaming-gate.yml"

permissions:
  contents: read

jobs:
  dreaming-gate:
    name: Deterministic Dreaming fixture and scope gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        env:
          # This daemon-only job does not run Electron's desktop application.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: bun install --frozen-lockfile
      - name: Build @signet/core for daemon source imports
        run: bun run --filter '@signet/core' build
      - name: Validate deterministic Dreaming scenarios
        run: >-
          bun test
          memorybench/src/benchmarks/dreaming-scenarios/index.test.ts
          memorybench/src/orchestrator/checkpoint.test.ts
          memorybench/src/providers/signet/index.test.ts
          platform/daemon/src/pipeline/memorybench-dreaming-gate.test.ts
