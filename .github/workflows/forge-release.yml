name: Forge Release

on:
  push:
    branches: [main]
    paths:
      - 'packages/forge/**'
      - '.github/workflows/forge-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.meta.outputs.skip }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' packages/forge/forge-version.json)
          TAG="forge-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: forge-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: forge-macos-x64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: forge-linux-x64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/forge
          key: forge-${{ matrix.target }}
      - name: Build Forge
        shell: bash
        working-directory: packages/forge
        run: cargo build --release --no-default-features --target "$RELEASE_TARGET"
        env:
          RELEASE_TARGET: ${{ matrix.target }}
      - name: Package asset
        shell: bash
        run: |
          cp "packages/forge/target/${RELEASE_TARGET}/release/forge" forge
          tar czf "${RELEASE_ASSET}" forge
          shasum -a 256 "${RELEASE_ASSET}" > "${RELEASE_ASSET}.sha256"
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ASSET: ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(find artifacts -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) | sort)
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Forge v${{ needs.prepare.outputs.version }}" \
            --notes "Forge release from the Signet monorepo (packages/forge)." \
            ${FILES}
