name: Phase D Stability Acceptance

on:
  pull_request:
    paths:
      - "platform/rust-daemon/**"
      - "platform/rust-core/**"
      - ".github/workflows/phase-d-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "platform/rust-daemon/**"
      - "platform/rust-core/**"
      - ".github/workflows/phase-d-acceptance.yml"
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Fresh Rust daemon acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build fresh Rust daemon
        run: cargo build --manifest-path platform/rust-daemon/Cargo.toml
      - uses: oven-sh/setup-bun@v2
      - name: Run Rust daemon contract tests
        run: bun test platform/rust-daemon/contract.test.ts
