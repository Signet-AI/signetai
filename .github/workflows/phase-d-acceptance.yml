name: Phase D Stability Acceptance

on:
  pull_request:
    paths:
      - "platform/rust-daemon/**"
      - "platform/rust-core/**"
      - "scripts/build-native-cli.ts"
      - "scripts/native-packaged-acceptance.test.ts"
      - ".github/workflows/phase-d-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "platform/rust-daemon/**"
      - "platform/rust-core/**"
      - "scripts/build-native-cli.ts"
      - "scripts/native-packaged-acceptance.test.ts"
      - ".github/workflows/phase-d-acceptance.yml"
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Fresh Rust daemon acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build fresh Rust daemon
        run: cargo build --manifest-path platform/rust-daemon/Cargo.toml
      - uses: oven-sh/setup-bun@v2
      - name: Build packaged Rust daemon
        run: bun run build:native-cli
      - name: Run Rust daemon contract tests
        run: bun test platform/rust-daemon/contract.test.ts
      - name: Packaged Rust acceptance without Bun or Node
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/native/signet-linux-x64
          test -s dist/native/signet-linux-x64.provenance.json
          env -i HOME="$HOME" PATH=/usr/bin:/bin SIGNET_NATIVE_ACCEPTANCE_BINARY="$GITHUB_WORKSPACE/dist/native/signet-linux-x64" SIGNET_NATIVE_PROVENANCE="$GITHUB_WORKSPACE/dist/native/signet-linux-x64.provenance.json" bun test scripts/native-packaged-acceptance.test.ts
