name: Phase D Stability Acceptance

on:
  pull_request:
    paths:
      - "platform/daemon/src/**"
      - "platform/core/src/**"
      - "tests/integration/acceptance/**"
      - ".github/workflows/phase-d-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "platform/daemon/src/**"
      - "platform/core/src/**"
      - "tests/integration/acceptance/**"
      - ".github/workflows/phase-d-acceptance.yml"
  schedule:
    # Full variant nightly, 07:15 UTC — catches drift the 90s PR smoke can't see.
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      scale:
        description: "Harness scale"
        required: false
        default: "smoke"
        type: choice
        options: ["smoke", "full"]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ github.event_name == 'schedule' && 'nightly → full' || 'PR/main' }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build @signet/core and @signet/daemon
        run: |
          bun run --filter '@signet/core' --filter '@signet/connector-base' --filter '@signet/connector-claude-code' --filter '@signet/connector-codex' --filter '@signet/connector-hermes-agent' build
          bun run --filter '@signet/daemon' build
      - name: Run Phase D acceptance harness
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SCALE=full
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SCALE=${{ inputs.scale }}
          else
            SCALE=smoke
          fi
          echo "Running Phase D acceptance at scale=$SCALE"
          bun tests/integration/acceptance/run.ts --scale "$SCALE" --out "$GITHUB_WORKSPACE/phase-d-artifacts"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-d-acceptance-${{ github.run_id }}
          path: phase-d-artifacts/
          if-no-files-found: ignore
