name: Phase D Stability Acceptance

on:
  pull_request:
    paths:
      - "platform/rust-daemon/**"
      - "platform/rust-core/**"
      - "scripts/build-native-cli.ts"
      - "scripts/native-packaged-acceptance.test.ts"
      - ".github/workflows/phase-d-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "platform/rust-daemon/**"
      - "platform/rust-core/**"
      - "scripts/build-native-cli.ts"
      - "scripts/native-packaged-acceptance.test.ts"
      - ".github/workflows/phase-d-acceptance.yml"
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Fresh Rust daemon acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build fresh Rust daemon
        run: cargo build --manifest-path platform/rust-daemon/Cargo.toml
      - uses: oven-sh/setup-bun@v2
      - name: Build packaged Rust daemon
        run: bun run build:native-cli
      - name: Run Rust daemon contract tests
        run: bun test platform/rust-daemon/contract.test.ts
      - name: Packaged Rust acceptance without Bun or Node
        shell: bash
        run: |
          set -euo pipefail
          platform="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$platform-$arch" in linux-x86_64) key=linux-x64 ;; linux-aarch64) key=linux-arm64 ;; darwin-x86_64) key=darwin-x64 ;; darwin-arm64) key=darwin-arm64 ;; *) echo "unsupported runner target: $platform-$arch" >&2; exit 1 ;; esac
          artifact="$GITHUB_WORKSPACE/dist/native/signet-$key"
          provenance="$artifact.provenance.json"
          test -s "$artifact" && test -s "$provenance"
          env -i HOME="$HOME" PATH=/usr/bin:/bin SIGNET_NATIVE_ACCEPTANCE_BINARY="$artifact" SIGNET_NATIVE_PROVENANCE="$provenance" bun test scripts/native-packaged-acceptance.test.ts
