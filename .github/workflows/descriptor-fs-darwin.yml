name: Descriptor Filesystem Darwin

on:
  pull_request:
    paths:
      - "platform/core/src/descriptor-fs*.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/descriptor-fs-darwin.yml"
  push:
    branches: [main]
    paths:
      - "platform/core/src/descriptor-fs*.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/descriptor-fs-darwin.yml"

permissions:
  contents: read

jobs:
  descriptor-fs-darwin:
    name: Descriptor filesystem (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS arm64
          - os: macos-15-intel
            platform: macOS x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test descriptor-rooted filesystem
        run: bun test --max-concurrency=1 platform/core/src/descriptor-fs.test.ts
