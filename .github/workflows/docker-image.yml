name: Docker Image

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to publish (e.g. 1.0.0)"
        type: string
        required: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      STABLE: ${{ !contains(inputs.version, '-') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - name: Decide floating tags
        id: floating
        run: |
          latest=$(gh release view --json tagName --jq .tagName --repo "${GITHUB_REPOSITORY}")
          if [ "${STABLE}" = true ] && [ "${latest}" = "v${VERSION}" ]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
          else
            echo "move=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ghcr.io/signet-ai/signet
          tags: |
            type=raw,value=v${{ inputs.version }}
            type=sha
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ env.STABLE }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ steps.floating.outputs.move }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ steps.floating.outputs.move }}
            type=raw,value=latest,enable=${{ steps.floating.outputs.move }}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify public GHCR latest pull
        if: steps.floating.outputs.move == 'true'
        run: |
          set -euo pipefail
          tmp_config="$(mktemp -d)"
          trap 'rm -rf "${tmp_config}"' EXIT
          if ! DOCKER_CONFIG="${tmp_config}" docker manifest inspect ghcr.io/signet-ai/signet:latest >/tmp/signet-public-manifest.json; then
            echo "::error::Published ghcr.io/signet-ai/signet:latest is not publicly pullable." >&2
            echo "The stable Docker image was pushed, but anonymous GHCR pulls cannot retrieve it." >&2
            echo "Set the GHCR package visibility to public and keep repository inheritance linked:" >&2
            echo "https://github.com/orgs/Signet-AI/packages/container/package/signet/settings" >&2
            exit 1
          fi
