name: Embedding Health Isolation

on:
  pull_request:
    paths:
      - "platform/daemon/src/native-embedding*.ts"
      - "platform/daemon/src/embedding-worker*.ts"
      - "platform/daemon/src/embedding-fetch.ts"
      - "platform/daemon/src/embedding-health.ts"
      - "platform/daemon/src/routes/utils.ts"
      - "platform/daemon/src/daemon.ts"
      - "platform/daemon/src/db-owner*.ts"
      - "platform/daemon/src/mcp-stdio*.ts"
      - "platform/daemon/src/pipeline/acpx-dreaming-mcp*.ts"
      - "platform/daemon/src/native-runtime-assets.ts"
      - "scripts/native-dreaming-mcp-smoke.test.ts"
      - "scripts/native-embedding-runtime-smoke.test.ts"
      - "scripts/native-dreaming-finalize-smoke.test.ts"
      - "scripts/native-worker-bundle-contract.test.ts"
      - "scripts/build-native-bun.ts"
      - ".github/workflows/embedding-health-isolation.yml"
  push:
    branches: [main]
    paths:
      - "platform/daemon/src/native-embedding*.ts"
      - "platform/daemon/src/embedding-worker*.ts"
      - "platform/daemon/src/embedding-fetch.ts"
      - "platform/daemon/src/embedding-health.ts"
      - "platform/daemon/src/routes/utils.ts"
      - "platform/daemon/src/daemon.ts"
      - "platform/daemon/src/db-owner*.ts"
      - "platform/daemon/src/mcp-stdio*.ts"
      - "platform/daemon/src/pipeline/acpx-dreaming-mcp*.ts"
      - "platform/daemon/src/native-runtime-assets.ts"
      - "scripts/native-dreaming-mcp-smoke.test.ts"
      - "scripts/native-embedding-runtime-smoke.test.ts"
      - "scripts/native-dreaming-finalize-smoke.test.ts"
      - "scripts/native-worker-bundle-contract.test.ts"
      - "scripts/build-native-bun.ts"
      - ".github/workflows/embedding-health-isolation.yml"

permissions:
  contents: read

jobs:
  isolation:
    name: Native embedding cannot block /health
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: bun install --frozen-lockfile

      - name: Build workspace dependencies
        run: bun run build
      - name: Worker-handle unit + facade contract tests
        working-directory: platform/daemon
        run: bun test src/embedding-worker-handle.test.ts src/native-embedding.test.ts

      - name: Native embedding /health isolation (source daemon)
        working-directory: platform/daemon
        run: bun test src/native-embedding-eventloop-isolation.test.ts
      - name: Build dashboard assets
        run: bun run build:dashboard

      - name: Build native Signet binary
        run: bun run build:native-cli

      - name: Compiled native subprocess smoke
        env:
          SIGNET_DB_OWNER_SMOKE: "1"
          SIGNET_DREAMING_MCP_SMOKE: "1"
          SIGNET_NATIVE_EMBEDDING_SMOKE: "0"
          SIGNET_NATIVE_SMOKE_BINARY: ./dist/native/signet-linux-x64
          SIGNET_TELEMETRY_OPTOUT: "1"
        run: bun test scripts/native-embedding-runtime-smoke.test.ts scripts/native-dreaming-mcp-smoke.test.ts scripts/native-dreaming-finalize-smoke.test.ts scripts/native-worker-bundle-contract.test.ts
