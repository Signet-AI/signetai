name: Embedding Health Isolation

on:
  pull_request:
    paths: ["platform/rust-daemon/**", "platform/rust-core/**", ".github/workflows/embedding-health-isolation.yml"]
  push:
    branches: [main]
    paths: ["platform/rust-daemon/**", "platform/rust-core/**", ".github/workflows/embedding-health-isolation.yml"]

permissions:
  contents: read

jobs:
  isolation:
    name: Rust daemon health remains isolated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build Rust daemon
        run: bun run build:native-cli
      - name: Rust daemon contract tests
        run: bun test platform/rust-daemon/contract.test.ts
      - name: Packaged smoke without Bun or Node
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/native/signet-linux-x64
          env -i HOME="$HOME" PATH=/usr/bin:/bin SIGNET_TELEMETRY_OPTOUT=1 dist/native/signet-linux-x64 --help >/dev/null
