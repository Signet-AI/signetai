name: Embedding Health Isolation

# Permanent CI invariant: the daemon's HTTP server (incl. /health) must stay
# responsive regardless of native embedding state — init, model download, or
# inference. The guard that would have caught the event-loop wedge fixed in
# this change. Runs the worker-handle unit tests (bounded RPC, crash/exit
# handling, sync status) and the end-to-end isolation test (real daemon over
# HTTP, model fetch stalled at a local blackhole, /health SLA asserted).
#
# Path-scoped pull_request + push-to-main.

on:
  pull_request:
    paths:
      - "platform/daemon/src/native-embedding*.ts"
      - "platform/daemon/src/embedding-worker*.ts"
      - "platform/daemon/src/memory-config.ts"
      - "platform/daemon/src/transformers-runtime.ts"
      - "platform/daemon/src/embedding-fetch.ts"
      - "platform/daemon/src/embedding-health.ts"
      - "platform/daemon/src/routes/utils.ts"
      - "platform/daemon/src/routes/health.ts"
      - "platform/daemon/src/daemon.ts"
      - "platform/daemon/src/db-owner*.ts"
      - "platform/daemon/src/mcp-stdio*.ts"
      - "platform/daemon/src/pipeline/acpx-dreaming-mcp*.ts"
      - "platform/daemon/src/native-runtime-assets.ts"
      - "platform/core/src/**"
      - "scripts/native-dreaming-mcp-smoke.test.ts"
      - "scripts/native-embedding-runtime-smoke.test.ts"
      - "scripts/native-dreaming-finalize-smoke.test.ts"
      - "scripts/native-worker-bundle-contract.test.ts"
      - "scripts/build-native-bun.ts"
      - ".github/workflows/embedding-health-isolation.yml"
  push:
    branches: [main]
    paths:
      - "platform/daemon/src/native-embedding*.ts"
      - "platform/daemon/src/embedding-worker*.ts"
      - "platform/daemon/src/memory-config.ts"
      - "platform/daemon/src/transformers-runtime.ts"
      - "platform/daemon/src/embedding-fetch.ts"
      - "platform/daemon/src/embedding-health.ts"
      - "platform/daemon/src/routes/utils.ts"
      - "platform/daemon/src/routes/health.ts"
      - "platform/daemon/src/daemon.ts"
      - "platform/daemon/src/db-owner*.ts"
      - "platform/daemon/src/mcp-stdio*.ts"
      - "platform/daemon/src/pipeline/acpx-dreaming-mcp*.ts"
      - "platform/daemon/src/native-runtime-assets.ts"
      - "platform/core/src/**"
      - "scripts/native-dreaming-mcp-smoke.test.ts"
      - "scripts/native-embedding-runtime-smoke.test.ts"
      - "scripts/native-dreaming-finalize-smoke.test.ts"
      - "scripts/native-worker-bundle-contract.test.ts"
      - "scripts/build-native-bun.ts"
      - ".github/workflows/embedding-health-isolation.yml"

permissions:
  contents: read

jobs:
  isolation:
    name: Native embedding cannot block /health
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        env:
          # This daemon-only job does not run Electron's desktop application.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: bun install --frozen-lockfile

      - name: Build workspace dependencies
        run: bun run build

      # Source-run e2e guard: use a valid configured workspace for the native
      # embedding /health probe and assert explicit incomplete workspaces fail
      # closed before the daemon can recreate state.
      - name: Source daemon /health isolation e2e
        working-directory: platform/daemon
        run: bun test src/native-embedding-eventloop-isolation.test.ts

      # Unit guard: proves the main-thread adapter never blocks while the
      # embedding worker is stuck (the ★ non-blocking invariant), plus RPC
      # bounds, crash/exit handling, and sync status. The compiled-binary
      # guard below builds the full workspace and exercises the shipped asset.
      - name: Worker-handle unit + facade contract tests
        working-directory: platform/daemon
        run: bun test src/embedding-worker-handle.test.ts src/native-embedding.test.ts

      # Compiled-binary guard: this is deliberately a separate gate from the
      # embedding smoke. It constructs DbOwnerClient inside the Bun-compiled
      # binary and executes a real owner query, so a missing embedded
      # db-owner-worker asset fails this PR check instead of being skipped.
      - name: Build dashboard assets
        run: bun run build:dashboard

      - name: Build native Signet binary
        run: bun run build:native-bun

      - name: Compiled native subprocess smoke
        env:
          SIGNET_DB_OWNER_SMOKE: "1"
          SIGNET_DREAMING_MCP_SMOKE: "1"
          SIGNET_NATIVE_EMBEDDING_SMOKE: "1"
          SIGNET_NATIVE_SMOKE_BINARY: ./dist/native/signet-linux-x64
          SIGNET_TELEMETRY_OPTOUT: "1"
        run: bun test scripts/native-embedding-runtime-smoke.test.ts scripts/native-dreaming-mcp-smoke.test.ts scripts/native-dreaming-finalize-smoke.test.ts scripts/native-worker-bundle-contract.test.ts
