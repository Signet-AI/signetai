name: Boot Wedge Safety Gate
on:
  pull_request:
    paths: ["platform/rust-daemon/**", "platform/rust-core/**", "scripts/native-rust-process-gate.ts", ".github/workflows/boot-wedge.yml"]
  push:
    branches: [main]
    paths: ["platform/rust-daemon/**", "platform/rust-core/**", "scripts/native-rust-process-gate.ts", ".github/workflows/boot-wedge.yml"]
permissions: { contents: read }
jobs:
  boot-wedge:
    name: Native Rust boot, liveness, and CPU ceiling
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build fresh Rust binary
        run: cargo build --manifest-path platform/rust-daemon/Cargo.toml
      - name: Run blocking Bun-driven Rust gate
        env:
          SIGNET_RUST_DAEMON_BIN: ${{ github.workspace }}/platform/rust-daemon/target/debug/signet-daemon
        run: bun scripts/native-rust-process-gate.ts
