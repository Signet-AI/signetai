name: Transcript Import Platform Contract

on:
  pull_request:
    paths:
      - "platform/daemon/src/transcript-import-*.ts"
      - "platform/core/src/migrations/151-transcript-import-bytes.ts"
      - "platform/daemon/src/routes/transcript-import-routes.ts"
      - "platform/daemon/src/routes/sources-routes.ts"
      - ".github/workflows/transcript-import-platform.yml"
  push:
    branches: [main]
    paths:
      - "platform/daemon/src/transcript-import-*.ts"
      - "platform/core/src/migrations/151-transcript-import-bytes.ts"
      - "platform/daemon/src/routes/transcript-import-routes.ts"
      - "platform/daemon/src/routes/sources-routes.ts"
      - ".github/workflows/transcript-import-platform.yml"

permissions:
  contents: read

jobs:
  platform-contract:
    name: Transcript import (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @signet/core build
      - name: Verify durable imports and legacy migration
        run: bun test --max-concurrency=1 platform/daemon/src/transcript-import-bytes.test.ts platform/daemon/src/transcript-import-scan.test.ts platform/daemon/src/transcript-import-commit.test.ts
