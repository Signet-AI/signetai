name: Event-loop Contract Audit

on:
  pull_request:
    paths:
      - "platform/daemon/src/**"
      - "scripts/audit-event-loop-contract.ts"
      - "scripts/event-loop-contract-baseline.json"
      - "scripts/audit-event-loop-contract.test.ts"
      - "docs/event-loop-contract-audit.md"
      - ".github/workflows/event-loop-contract.yml"
  push:
    branches: [main]
    paths:
      - "platform/daemon/src/**"
      - "scripts/audit-event-loop-contract.ts"
      - "scripts/event-loop-contract-baseline.json"
      - "scripts/audit-event-loop-contract.test.ts"
      - "docs/event-loop-contract-audit.md"
      - ".github/workflows/event-loop-contract.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Enforce async DB accessor boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit type boundary and migration ledger
        run: bun scripts/audit-event-loop-contract.ts
      - name: Test boundary fixtures
        run: bun test scripts/audit-event-loop-contract.test.ts
