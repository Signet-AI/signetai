name: Event-loop Contract Gate
on:
  pull_request:
    paths: ["platform/rust-daemon/**", "platform/rust-core/**", "scripts/native-rust-process-gate.ts", ".github/workflows/event-loop-contract.yml"]
  push:
    branches: [main]
    paths: ["platform/rust-daemon/**", "platform/rust-core/**", "scripts/native-rust-process-gate.ts", ".github/workflows/event-loop-contract.yml"]
permissions: { contents: read }
jobs:
  rust-process:
    name: Blocking Rust process lifecycle gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build fresh Rust binary
        run: cargo build --manifest-path platform/rust-daemon/Cargo.toml
      - name: Enforce native process lifecycle
        env:
          SIGNET_RUST_DAEMON_BIN: ${{ github.workspace }}/platform/rust-daemon/target/debug/signet-daemon
        run: bun scripts/native-rust-process-gate.ts
