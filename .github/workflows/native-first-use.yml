name: Native First-Use Acceptance

on:
  pull_request:
    paths: ["platform/rust-daemon/**", "platform/rust-core/**", "scripts/build-native-cli.ts", ".github/workflows/native-first-use.yml"]
  push:
    branches: [main]
    paths: ["platform/rust-daemon/**", "platform/rust-core/**", "scripts/build-native-cli.ts"]

permissions:
  contents: read

jobs:
  first-use:
    name: Rust daemon first-use on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build packaged Rust daemon
        run: bun run build:native-cli
      - name: Run Rust daemon contract tests
        run: bun test platform/rust-daemon/contract.test.ts
      - name: Packaged smoke without Bun or Node
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) asset="dist/native/signet-linux-x64" ;;
            macOS) asset="dist/native/signet-darwin-x64" ;;
            Windows) asset="dist/native/signet-win32-x64.exe" ;;
          esac
          test -s "$asset"
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$asset" --help >/dev/null
