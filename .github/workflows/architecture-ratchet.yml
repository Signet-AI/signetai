name: Architecture ratchet

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Architecture audit and ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: bun install --frozen-lockfile

      - name: Architecture contract tests
        run: bun test scripts/audit-architecture-contract.test.ts

      - name: Generate protected base inventory and enforce architecture ratchet
        if: github.event_name == 'pull_request'
        env:
          BASE_ROOT: ${{ runner.temp }}/architecture-base
          CANDIDATE_ROOT: ${{ github.workspace }}
          TRUSTED_AUDITOR_COMMIT: 42017f87518556d3a94151100f7329232a94e0de
          TRUSTED_AUDITOR: ${{ runner.temp }}/trusted-audit-architecture-contract.ts
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags origin "$TRUSTED_AUDITOR_COMMIT"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/node_modules"
          git show "$TRUSTED_AUDITOR_COMMIT:scripts/audit-architecture-contract.ts" > "$TRUSTED_AUDITOR"
          mkdir -p "$BASE_ROOT"
          git archive "${{ github.event.pull_request.base.sha }}" | tar -x -C "$BASE_ROOT"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE_ROOT/node_modules"
          mkdir -p "$BASE_ROOT/web/docs" "$BASE_ROOT/web/marketing"
          ln -s "$GITHUB_WORKSPACE/web/docs/node_modules" "$BASE_ROOT/web/docs/node_modules"
          ln -s "$GITHUB_WORKSPACE/web/marketing/node_modules" "$BASE_ROOT/web/marketing/node_modules"
          bun -e '
            import { pathToFileURL } from "node:url";
            const trustedAuditor = process.env.TRUSTED_AUDITOR;
            const baseRoot = process.env.BASE_ROOT;
            const candidateRoot = process.env.CANDIDATE_ROOT;
            if (trustedAuditor === undefined || baseRoot === undefined || candidateRoot === undefined)
              throw new Error("missing protected architecture audit paths");
            const { analyzeSourceTree, compareArchitectureRatchet } = await import(pathToFileURL(trustedAuditor).href);
            const protectedBase = analyzeSourceTree({ root: baseRoot, sourceRoot: baseRoot, validateGeneratedArtifacts: false });
            const candidate = analyzeSourceTree({ root: candidateRoot, sourceRoot: candidateRoot, validateGeneratedArtifacts: false });
            const findings = compareArchitectureRatchet(candidate, protectedBase);
            if (findings.length > 0) {
              console.error("Architecture ratchet violations:");
              for (const finding of findings) console.error(`- ${finding}`);
              process.exit(1);
            }
            console.log("Architecture ratchet: protected base respected");
          '

      - name: Enforce architecture ratchet on main
        if: github.event_name != 'pull_request'
        run: bun run audit:architecture
