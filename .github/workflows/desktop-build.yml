name: Desktop Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      signing_mode:
        description: "Signing mode for macOS/Windows desktop artifacts"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - official
          - self-signed

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            os_name: macos-arm64
          - runner: macos-13
            arch: x64
            os_name: macos-x64
          - runner: ubuntu-22.04
            arch: x64
            os_name: linux-x64
          - runner: windows-latest
            arch: x64
            os_name: windows-x64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve signing mode
        id: signing
        env:
          SIGNING_MODE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode || 'auto' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          mode="${SIGNING_MODE_INPUT}"
          if [ "${mode}" = "auto" ]; then
            mode="self-signed"
            if [[ "${{ matrix.runner }}" == macos-* ]] && [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
              mode="official"
            fi
            if [ "${{ matrix.runner }}" = "windows-latest" ] && [ -n "${WINDOWS_CERTIFICATE:-}" ] && [ -n "${WINDOWS_CERTIFICATE_PASSWORD:-}" ]; then
              mode="official"
            fi
          fi
          if [ "${mode}" != "official" ] && [ "${mode}" != "self-signed" ]; then
            echo "::error::Invalid signing mode: ${mode}"
            exit 1
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "Desktop signing mode: ${mode}"

      - name: Configure Electron signing
        if: steps.signing.outputs.mode == 'official'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          write_env() {
            name="$1"
            value="$2"
            marker="EOF_${name}_$$"
            {
              echo "${name}<<${marker}"
              printf '%s\n' "${value}"
              echo "${marker}"
            } >> "${GITHUB_ENV}"
          }

          if [[ "${{ matrix.runner }}" == macos-* ]]; then
            write_env CSC_LINK "${APPLE_CERTIFICATE}"
            write_env CSC_KEY_PASSWORD "${APPLE_CERTIFICATE_PASSWORD}"
            write_env CSC_NAME "${APPLE_SIGNING_IDENTITY}"
          elif [ "${{ matrix.runner }}" = "windows-latest" ]; then
            write_env CSC_LINK "${WINDOWS_CERTIFICATE}"
            write_env CSC_KEY_PASSWORD "${WINDOWS_CERTIFICATE_PASSWORD}"
          fi

      - name: Install dependencies
        run: bun install

      - name: Build Electron desktop app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.mode == 'official' && 'true' || 'false' }}
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        run: cd packages/desktop && bun run build:desktop -- --${{ matrix.arch }}

      - name: Generate AUR metadata
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          APPIMAGE="$(find packages/desktop/release -name '*.AppImage' | head -n 1)"
          if [ -z "${APPIMAGE}" ]; then
            echo "::error::No AppImage artifact found"
            exit 1
          fi
          SHA="$(sha256sum "${APPIMAGE}" | awk '{print $1}')"
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "${VER}" ] || [ "${VER}" = "${GITHUB_REF_NAME}" ]; then
            VER="$(node -p "require('./package.json').version")"
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VER}/$(basename "${APPIMAGE}")"
          bash deploy/aur/generate-pkgbuild.sh "${VER}" "${URL}" "${SHA}"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os_name }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.exe
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest*.yml
          if-no-files-found: error

      - name: Upload AUR metadata
        if: matrix.runner == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: aur-metadata
          path: |
            deploy/aur/PKGBUILD
            deploy/aur/.SRCINFO

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.exe
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest*.yml

  validate-aur:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download AUR metadata
        uses: actions/download-artifact@v4
        with:
          name: aur-metadata
          path: deploy/aur

      - name: Validate Arch package metadata
        run: |
          set -euo pipefail
          test -f deploy/aur/PKGBUILD
          test -f deploy/aur/.SRCINFO
          docker run --rm \
            -v "${PWD}:/work" \
            -w /work/deploy/aur \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman -Sy --noconfirm base-devel pacman-contrib sudo
              useradd -m builder
              chown -R builder:builder /work/deploy/aur
              su builder -c "cd /work/deploy/aur && makepkg --printsrcinfo > /tmp/.SRCINFO.generated"
              diff -u /work/deploy/aur/.SRCINFO /tmp/.SRCINFO.generated
            '
