name: README Translations

on:
  pull_request:
    paths:
      - "README.md"
      - "README.*.md"
      - "scripts/sync-readme-translations.ts"
      - ".github/workflows/readme-translations.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/sync-readme-translations.ts"
      - ".github/workflows/readme-translations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Verify translation structure
        run: bun scripts/sync-readme-translations.ts --check

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: readme-translations
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent@1.0.2

      - name: Sync translations
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: bun scripts/sync-readme-translations.ts

      - name: Open pull request
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- 'README.*.md')" ]; then
            echo "Translations are current."
            exit 0
          fi
          branch=automation/readme-translations
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -- 'README.*.md'
          git commit -m "docs(readme): sync translations"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "docs(readme): sync translations" \
              --body "Updates the translated READMEs to match README.md at ${GITHUB_SHA}. Generated by scripts/sync-readme-translations.ts with Pi and zai/glm-5.3-flash. Review the changed sections before merging."
          fi
