name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        required: true
        default: check
        options:
          - check
          - next
          - stable

permissions: {}

concurrency:
  group: release-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Plan release and prepare draft
        id: plan
        run: bun scripts/release-plan.ts
        env:
          CHANNEL: ${{ inputs.channel }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-native:
    needs: plan
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            asset: signet-linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            asset: signet-linux-arm64
          - os: macos-15-intel
            platform: darwin-x64
            asset: signet-darwin-x64
          - os: xcode-27
            platform: darwin-arm64
            asset: signet-darwin-arm64
          - os: windows-latest
            platform: win32-x64
            asset: signet-win32-x64.exe
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      SIGNET_NATIVE_PLATFORM: ${{ matrix.platform }}
      RELEASE_ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Stamp release version
        shell: bash
        run: |
          if [ "$RELEASE_VERSION" != "$(bun -p 'require("./package.json").version')" ]; then
            bun scripts/version-sync.ts --to "$RELEASE_VERSION"
          fi

      - name: Install dependencies
        run: bun install

      - name: Build workspace dependencies
        run: bun run build

      - name: CLI runtime smoke check
        if: matrix.platform == 'linux-x64'
        run: bun surfaces/cli/src/cli.ts --help > /dev/null

      - name: Native embedding /health isolation (source daemon)
        if: matrix.platform == 'linux-x64'
        working-directory: platform/daemon
        run: bun test src/native-embedding-eventloop-isolation.test.ts

      - name: Build dashboard assets
        run: bun run build:dashboard

      - name: Build native Signet binary
        env:
          SIGNET_REQUIRE_NATIVE_ADDON: "1"
        run: bun run build:native-bun

      - name: Sign and verify macOS native binary with Developer ID
        if: startsWith(matrix.platform, 'darwin-')
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/sign-macos-native.sh "./dist/native/${RELEASE_ASSET}"

      - name: Smoke native binary
        shell: bash
        run: ./dist/native/"$RELEASE_ASSET" --help > /dev/null

      - name: Verify native binary artifact
        shell: bash
        run: test -s ./dist/native/"$RELEASE_ASSET"

      - name: Verify embedded Bun runtime
        shell: bash
        env:
          SIGNET_RUNTIME_VERSION_SMOKE: "1"
        run: |
          actual="$(./dist/native/"$RELEASE_ASSET" | bun -e 'const value = JSON.parse(await Bun.stdin.text()); process.stdout.write(value.bun)')"
          expected="$(bun -e 'const value = JSON.parse(await Bun.file("package.json").text()); process.stdout.write(value.packageManager.replace(/^bun@/, ""))')"
          test "$actual" = "$expected"

      - name: Verify embedded native tokenizer
        shell: bash
        env:
          SIGNET_NATIVE_TOKENIZER_SMOKE: "1"
        run: |
          actual="$(./dist/native/"$RELEASE_ASSET" | bun -e 'const value = JSON.parse(await Bun.stdin.text()); process.stdout.write(String(value.pairTokenizer))')"
          test "$actual" = "true"

      - name: Native release runtime smoke
        shell: bash
        env:
          SIGNET_NATIVE_EMBEDDING_SMOKE: "0"
          SIGNET_DB_OWNER_SMOKE: "1"
          SIGNET_DREAMING_TOKEN_SMOKE: "1"
          SIGNET_DREAMING_MCP_SMOKE: "1"
          SIGNET_NATIVE_SMOKE_BINARY: ./dist/native/${{ matrix.asset }}
          SIGNET_TELEMETRY_OPTOUT: "1"
        run: bun test scripts/native-embedding-runtime-smoke.test.ts scripts/native-dreaming-mcp-smoke.test.ts scripts/native-dreaming-finalize-smoke.test.ts scripts/native-worker-bundle-contract.test.ts

      - name: Native first-use acceptance
        shell: bash
        env:
          SIGNET_NATIVE_FIRST_USE_SMOKE: "1"
          SIGNET_NATIVE_SMOKE_BINARY: ./dist/native/${{ matrix.asset }}
        run: bun test scripts/native-first-use-smoke.test.ts

      - name: Upload to release
        if: inputs.channel != 'check'
        shell: bash
        run: |
          STAGING="${RUNNER_TEMP}/upload"
          mkdir -p "${STAGING}"
          cp "dist/native/${RELEASE_ASSET}" "${STAGING}/${RELEASE_ASSET}"
          openssl dgst -sha256 -hex "${STAGING}/${RELEASE_ASSET}" | awk '{print $NF}' > "${STAGING}/${RELEASE_ASSET}.sha256"
          gh release upload "v${RELEASE_VERSION}" "${STAGING}/${RELEASE_ASSET}" --clobber
          gh release upload "v${RELEASE_VERSION}" "${STAGING}/${RELEASE_ASSET}.sha256" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    needs: plan
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.version }}
      release_tag: ${{ inputs.channel != 'check' && needs.plan.outputs.tag || '' }}
    secrets: inherit

  publish:
    needs: [plan, build-native, desktop]
    runs-on: ubuntu-latest
    if: inputs.channel != 'check'
    permissions:
      contents: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NEW_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Stamp release version
        shell: bash
        run: |
          if [ "$RELEASE_VERSION" != "$(bun -p 'require("./package.json").version')" ]; then
            bun scripts/version-sync.ts --to "$RELEASE_VERSION"
          fi

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Download native release assets
        run: |
          mkdir -p dist/native
          gh release download "v${NEW_VERSION}" --pattern "signet-*" --dir dist/native --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and upload native manifest
        run: |
          set -euo pipefail
          SIGNET_VERSION="$NEW_VERSION" bun scripts/build-connector-assets.ts
          gh release upload "v${NEW_VERSION}" dist/native/signet-connectors-"${NEW_VERSION}".tar.gz --clobber
          bun run build:daemon-js-assets
          gh release upload "v${NEW_VERSION}" dist/native/signet-daemon-js-"${NEW_VERSION}".tar.gz --clobber
          SIGNET_VERSION="$NEW_VERSION" bun scripts/generate-native-manifest.ts
          gh release upload "v${NEW_VERSION}" dist/native/native-manifest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ASSETS < <(gh release view "v${NEW_VERSION}" --json assets --jq '.assets[].name')
          expected=(
            signet-linux-x64
            signet-linux-x64.sha256
            signet-linux-arm64
            signet-linux-arm64.sha256
            signet-darwin-arm64
            signet-darwin-arm64.sha256
            signet-darwin-x64
            signet-darwin-x64.sha256
            signet-win32-x64.exe
            signet-win32-x64.exe.sha256
            signet-connectors-${NEW_VERSION}.tar.gz
            signet-daemon-js-${NEW_VERSION}.tar.gz
            native-manifest.json
            "Signet-${NEW_VERSION}-linux-amd64.deb"
            "Signet-${NEW_VERSION}-linux-x86_64.AppImage"
            "Signet-${NEW_VERSION}-mac-arm64.dmg"
            "Signet-${NEW_VERSION}-mac-arm64.dmg.blockmap"
            "Signet-${NEW_VERSION}-mac-arm64.zip"
            "Signet-${NEW_VERSION}-mac-arm64.zip.blockmap"
            "Signet-${NEW_VERSION}-mac-x64.dmg"
            "Signet-${NEW_VERSION}-mac-x64.dmg.blockmap"
            "Signet-${NEW_VERSION}-mac-x64.zip"
            "Signet-${NEW_VERSION}-mac-x64.zip.blockmap"
            "Signet-${NEW_VERSION}-win-x64.exe"
            "Signet-${NEW_VERSION}-win-x64.exe.blockmap"
            "latest-linux.yml"
            "latest-mac.yml"
            "latest.yml"
          )
          for asset in "${expected[@]}"; do
            if ! printf '%s\n' "${ASSETS[@]}" | grep -Fxq "$asset"; then
              echo "::error::Missing release asset: $asset"
              exit 1
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify macOS update manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest_dir="${RUNNER_TEMP}/mac-update-manifest"
          mkdir -p "${manifest_dir}"
          scripts/retry-github-release.sh gh release download "v${NEW_VERSION}" --pattern "latest-mac.yml" --dir "${manifest_dir}" --clobber --repo "${GITHUB_REPOSITORY}"
          bun surfaces/desktop/scripts/merge-mac-update-manifest.ts \
            --verify "${manifest_dir}/latest-mac.yml" \
            --version "${NEW_VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack native npm release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native-packages
          stage_native_package() {
            local platform="$1"
            local asset="$2"
            local binary="$3"
            local package_dir="dist/signetai-${platform}"
            mkdir -p "${package_dir}/bin"
            cp "dist/native/${asset}" "${package_dir}/bin/${binary}"
            chmod 755 "${package_dir}/bin/${binary}"
            npm pack "./${package_dir}" --pack-destination dist/native-packages
          }

          stage_native_package "linux-x64" "signet-linux-x64" "signet"
          stage_native_package "linux-arm64" "signet-linux-arm64" "signet"
          stage_native_package "darwin-x64" "signet-darwin-x64" "signet"
          stage_native_package "darwin-arm64" "signet-darwin-arm64" "signet"
          stage_native_package "win32-x64" "signet-win32-x64.exe" "signet.exe"

          gh release upload "v${NEW_VERSION}" dist/native-packages/*.tgz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Point npm wrapper at native release assets
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${NEW_VERSION}"
          npm pkg set --prefix dist/signetai \
            "optionalDependencies.signetai-linux-x64=${release_url}/signetai-linux-x64-${NEW_VERSION}.tgz" \
            "optionalDependencies.signetai-linux-arm64=${release_url}/signetai-linux-arm64-${NEW_VERSION}.tgz" \
            "optionalDependencies.signetai-darwin-x64=${release_url}/signetai-darwin-x64-${NEW_VERSION}.tgz" \
            "optionalDependencies.signetai-darwin-arm64=${release_url}/signetai-darwin-arm64-${NEW_VERSION}.tgz" \
            "optionalDependencies.signetai-win32-x64=${release_url}/signetai-win32-x64-${NEW_VERSION}.tgz"
          cp dist/native/native-manifest.json dist/signetai/native-manifest.json

      - name: Validate publish manifests
        run: bun scripts/check-publish-manifests.ts
        env:
          SIGNET_EXPECT_NATIVE_OPTIONAL_DEPS: "1"

      - name: Stage scoped npm packages
        run: bun scripts/stage-npm-publish.ts "${RUNNER_TEMP}/signet-npm-publish"

      - name: Publish npm packages
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/released-npm-packages"
          test -n "$NODE_AUTH_TOKEN"
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          publish_npm_package() {
            local package_dir="$1"
            local optional="${2:-false}"
            local package_name
            package_name=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).name)' "${package_dir}/package.json")
            local current
            current=$(npm view "${package_name}@${NEW_VERSION}" version 2>/dev/null || echo "0.0.0")
            if [ "$current" = "$NEW_VERSION" ]; then
              echo "${package_name}@${NEW_VERSION} already published; reusing it"
            elif [ "$optional" = "true" ]; then
              (cd "$package_dir" && npm publish --tag release-staging --access public) || return 0
            else
              (cd "$package_dir" && npm publish --tag release-staging --access public)
            fi
            printf '%s\n' "${package_name}" >> "${RUNNER_TEMP}/released-npm-packages"
          }

          STAGED_NPM_ROOT="${RUNNER_TEMP}/signet-npm-publish"
          publish_npm_package "${STAGED_NPM_ROOT}/core"
          publish_npm_package "${STAGED_NPM_ROOT}/connector-base"
          publish_npm_package "${STAGED_NPM_ROOT}/connector-claude-code"
          publish_npm_package "${STAGED_NPM_ROOT}/connector-codex"
          publish_npm_package "${STAGED_NPM_ROOT}/connector-forge"
          publish_npm_package "${STAGED_NPM_ROOT}/connector-gemini"
          publish_npm_package "${STAGED_NPM_ROOT}/connector-hermes-agent"
          publish_npm_package "${STAGED_NPM_ROOT}/connector-kimi"
          publish_npm_package "${STAGED_NPM_ROOT}/connector-muse-code"
          publish_npm_package "${STAGED_NPM_ROOT}/connector-oh-my-pi"
          publish_npm_package "${STAGED_NPM_ROOT}/connector-openclaw"
          publish_npm_package "${STAGED_NPM_ROOT}/connector-opencode"
          publish_npm_package "${STAGED_NPM_ROOT}/connector-pi"
          publish_npm_package "${STAGED_NPM_ROOT}/codex-plugin"
          publish_npm_package dist/signetai
          publish_npm_package integrations/openclaw/memory-adapter true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc

      - name: Finalize GitHub release
        shell: bash
        run: |
          if [ "$CHANNEL" = stable ]; then
            scripts/retry-github-release.sh gh release edit "v${NEW_VERSION}" --draft=false --prerelease=false --latest --repo "${GITHUB_REPOSITORY}"
          else
            scripts/retry-github-release.sh gh release edit "v${NEW_VERSION}" --draft=false --prerelease --latest=false --repo "${GITHUB_REPOSITORY}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance npm channels
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r package_name; do
            if [ "$CHANNEL" = stable ]; then
              scripts/advance-npm-dist-tag.sh "${package_name}" "${NEW_VERSION}" latest
            fi
            scripts/advance-npm-dist-tag.sh "${package_name}" "${NEW_VERSION}" next
            staged=$(npm view "${package_name}" dist-tags.release-staging)
            if [ "$staged" = "$NEW_VERSION" ]; then
              npm dist-tag rm "${package_name}" release-staging
            fi
          done < "${RUNNER_TEMP}/released-npm-packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc
