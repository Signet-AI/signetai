name: Rust Daemon Check

on:
  pull_request:
    paths:
      - "platform/rust-daemon/**"
      - "platform/rust-core/**"
      - ".github/workflows/daemon-typecheck.yml"
  push:
    branches: [main]
    paths:
      - "platform/rust-daemon/**"
      - "platform/rust-core/**"

permissions:
  contents: read

jobs:
  check:
    name: Rust daemon cargo check and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo check
        run: cargo check --manifest-path platform/rust-daemon/Cargo.toml
      - name: Build daemon
        run: cargo build --manifest-path platform/rust-daemon/Cargo.toml
      - uses: oven-sh/setup-bun@v2
      - name: Contract tests
        run: bun test platform/rust-daemon/contract.test.ts
