name: Daemon Typecheck

# Blocking daemon production typecheck gate (#969).
#
# Tests run through the Bun test suite; this project checks the daemon sources
# that ship to users and excludes test-only mocks and fixtures.
on:
  pull_request:
    paths:
      - "platform/daemon/src/**"
      - "platform/daemon/tsconfig.json"
      - "platform/daemon/package.json"
      - "platform/core/src/**"
      - ".github/workflows/daemon-typecheck.yml"
  push:
    branches: [main]
    paths:
      - "platform/daemon/src/**"
      - "platform/daemon/tsconfig.json"
      - "platform/daemon/package.json"
      - "platform/core/src/**"

permissions:
  contents: read

jobs:
  typecheck:
    name: Daemon production tsc --noEmit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build @signet/core (daemon imports its compiled types)
        shell: bash
        run: bun run --filter '@signet/core' build

      - name: Daemon typecheck
        id: tsc
        shell: bash
        run: |
          set +e
          # The daemon tsconfig excludes test-only mocks/fixtures; those are
          # exercised by the Bun test suite. Keep the rootDir cross-package
          # TS6059 noise out of this production source gate.
          cd platform/daemon
          set +e
          npx tsc --noEmit > /tmp/daemon-tsc-raw.txt 2>&1
          TSC_STATUS=$?
          grep -v "TS6059" /tmp/daemon-tsc-raw.txt > /tmp/daemon-tsc.txt || true
          cat /tmp/daemon-tsc.txt
          if grep -q "error TS" /tmp/daemon-tsc.txt; then
            exit 1
          fi
          # Preserve failures that did not produce a TypeScript diagnostic
          # (for example, an invocation or resource failure).
          if [ "$TSC_STATUS" -ne 0 ] && ! grep -q "TS6059" /tmp/daemon-tsc-raw.txt; then
            exit "$TSC_STATUS"
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Daemon Production Typecheck" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          OUTCOME="${{ steps.tsc.outcome }}"
          if [ "$OUTCOME" != "success" ]; then
            echo "❌ Daemon production typecheck failed (outcome: $OUTCOME)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Daemon production \`tsc --noEmit\` is clean." >> "$GITHUB_STEP_SUMMARY"
          fi
