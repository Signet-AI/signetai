[package]
name = "signet-daemon-native"
version = "0.226.7"
edition = "2021"
license = "Apache-2.0"
description = "Fresh native Rust daemon for Signet"

[[bin]]
name = "signet-daemon"
path = "src/main.rs"

[[bin]]
name = "signet-mcp"
path = "src/bin/signet-mcp.rs"

[dependencies]
signet-core-native = { path = "../rust-core" }
axum = { version = "0.8", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
libc = "0.2"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
