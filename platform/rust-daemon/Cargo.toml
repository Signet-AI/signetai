[package]
name = "signet-daemon-native"
version = "0.226.7"
edition = "2021"
license = "Apache-2.0"
description = "Fresh native Rust daemon for Signet"

[[bin]]
name = "signet-daemon"
path = "src/main.rs"

[dependencies]
signet-core-native = { path = "../rust-core" }
axum = { version = "0.8", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
