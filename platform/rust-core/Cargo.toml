[package]
name = "signet-core-native"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "sync"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
unicode-normalization = "0.1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "signet-core-test-driver"
path = "src/bin/signet-core-test-driver.rs"

[dev-dependencies]
tempfile = "3"
